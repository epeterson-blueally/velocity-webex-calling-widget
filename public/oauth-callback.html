<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Signing in to Webex Calling…</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        min-height: 100vh;
        margin: 0;
        align-items: center;
        justify-content: center;
        color: #1a1a1a;
        background: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        body { color: #f0f0f0; background: #1e1e1e; }
      }
      .msg { font-size: 0.95rem; text-align: center; padding: 24px; }
    </style>
  </head>
  <body>
    <div class="msg" id="msg">Completing sign-in…</div>
    <script>
      // OAuth redirect target for OAuthTokenProvider's popup flow.
      //
      // This page is the redirect_uri. It runs inside the popup that the widget
      // opened, reads the authorization code + state that Webex appended to the
      // URL, and hands them back to the opener (the widget) via postMessage, then
      // closes. It stores NOTHING — no code, no token, no verifier — anywhere.
      //
      // Origin handling (the important part): this page is served from the Pages
      // origin, but the OPENER (the widget) may be running under a DIFFERENT origin
      // — in the primary web-component packaging the widget script executes inside
      // the Agent Desktop's document, so the opener's origin is the desktop origin,
      // not this Pages origin. postMessage silently drops the message if targetOrigin
      // does not match the opener's real origin, so we must target the opener's exact
      // origin. The widget encoded that origin into the OAuth `state` (as { n, o });
      // `state` is round-tripped verbatim by Webex, so we decode `o` here and target
      // it. We pass the FULL original `state` back unchanged so the widget can still
      // verify the nonce. The widget also re-checks event.origin on its side.
      (function () {
        var params = new URLSearchParams(window.location.search);
        var rawState = params.get('state') || undefined;
        var message = {
          type: 'velocity-webex-oauth',
          code: params.get('code') || undefined,
          state: rawState,
          error: params.get('error') || undefined,
          error_description: params.get('error_description') || undefined,
        };

        // Decode the opener origin from `state` (base64url JSON { n, o }).
        function openerOriginFromState(state) {
          if (!state) return null;
          try {
            var b64 = state.replace(/-/g, '+').replace(/_/g, '/');
            b64 += '='.repeat((4 - (b64.length % 4)) % 4);
            var obj = JSON.parse(decodeURIComponent(escape(atob(b64))));
            var o = obj && obj.o;
            // Validate it is a well-formed absolute origin before trusting it.
            if (typeof o === 'string' && new URL(o).origin === o) return o;
          } catch (e) {
            /* fall through */
          }
          return null;
        }

        var msgEl = document.getElementById('msg');
        if (window.opener && window.opener !== window) {
          var target = openerOriginFromState(rawState);
          if (target) {
            // Target the opener's exact origin (may differ from this page's origin).
            window.opener.postMessage(message, target);
          } else {
            // CAVEAT: could not recover/validate the opener origin from state, so we
            // fall back to '*'. The message is not confidential (no token/secret —
            // only an authorization code the widget still exchanges via the secret-
            // holding backend, guarded by PKCE and the state nonce), so '*' is an
            // acceptable last resort here; the widget still validates state+origin.
            window.opener.postMessage(message, '*');
          }
          window.close();
          if (msgEl) msgEl.textContent = 'Sign-in complete. You can close this window.';
        } else {
          // Fallback: the flow was not opened as a popup (e.g. popups blocked and
          // a top-level redirect was used instead). We cannot postMessage; tell the
          // user to return to the widget. The widget's popup path is the supported
          // route — see docs/auth-backend-contract.md.
          if (msgEl) {
            msgEl.textContent = message.error
              ? 'Sign-in failed: ' + message.error
              : 'Sign-in complete. Please return to the Agent Desktop.';
          }
        }
      })();
    </script>
  </body>
</html>
